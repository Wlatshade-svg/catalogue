<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Bod;src:url(fonts/bodoni.woff2)}
@font-face{font-family:BodI;src:url(fonts/bodoni-italic.woff2)}
@font-face{font-family:Pin;src:url(fonts/pinyon.woff2)}
@font-face{font-family:Nas;src:url(fonts/naskh.woff2)}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block;width:1920px;height:1080px}
</style></head><body><canvas id="c" width="3840" height="2160"></canvas>
<script type="module">
import { mulberry, clamp, lerp, vnoise } from '/core/lib.js';

const W = 1920, H = 1080, SS = 2;
const Q = new URLSearchParams(location.search);
const WASH = Q.get('wash') !== '0';
const PAPER = '#f1e8d2', INK = '#1c1510';
const PI = Math.PI;

function mk() { const c = document.createElement('canvas'); c.width = W * SS; c.height = H * SS; const x = c.getContext('2d'); x.scale(SS, SS); return [c, x]; }
const [inkC, ink] = mk();
const [washC, wash] = mk();
const [paperC, paper] = mk();

/* ---------------- 3D camera ---------------- */
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(...a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const lerp3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

const CAM = [-7.6, 6.5, -10.2], TGT = [0.3, 1.45, 3.4];
const FW = norm(sub(TGT, CAM)), RT = norm(cross(FW, [0, 1, 0])).map(v => -v), UP = cross(RT, FW).map(v => -v);
const F = 1520, CX = 900, CY = 600;
let SHIFT = [0, 0, 0];
function P(p) { const d = sub(add(p, SHIFT), CAM); const z = dot(d, FW); return [CX + F * dot(d, RT) / z, CY - F * dot(d, UP) / z]; }
function depth(p) { return dot(sub(add(p, SHIFT), CAM), FW); }
const LIGHT = norm([-0.55, 0.8, -0.35]);      // towards the sun: upper left, a little towards us

/* ---------------- burin primitives ---------------- */
const swell = u => (0.2 + 0.8 * Math.pow(Math.sin(PI * clamp(u)), 0.7)) * Math.pow(clamp(Math.min(u, 1 - u) / 0.22), 0.5);

// fill a variable-width stroke along pts with widths ws
function band(c, pts, ws) {
  const n = pts.length; if (n < 2) return;
  const L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const w = ws[i] / 2;
    L.push([pts[i][0] - dy * w, pts[i][1] + dx * w]); R.push([pts[i][0] + dy * w, pts[i][1] - dx * w]);
  }
  c.beginPath(); c.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) c.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) c.lineTo(R[i][0], R[i][1]);
  c.closePath(); c.fill();
}
// cut one line: tone-driven widths, split into runs where the tone falls below threshold, each run swells
function cut(pts, wOf, minLen = 3) {
  let run = [], wr = [];
  const flush = () => {
    if (run.length > 1) {
      let len = 0; const acc = [0];
      for (let i = 1; i < run.length; i++) { len += Math.hypot(run[i][0] - run[i - 1][0], run[i][1] - run[i - 1][1]); acc.push(len); }
      if (len >= minLen) band(ink, run, wr.map((w, i) => w * swell(acc[i] / len)));
    }
    run = []; wr = [];
  };
  for (let i = 0; i < pts.length; i++) {
    const w = wOf(pts[i], i);
    if (w > 0.06) { run.push(pts[i]); wr.push(w); } else flush();
  }
  flush();
}
const fam = (t, th, w) => t <= th ? 0 : w * Math.pow((t - th) / (1 - th), 0.65) + 0.15;

// parallel hatching of a polygon (screen space)
function hatch(poly, o) {
  const { ang = 0.5, sp = 4.2, tone, w = 1.7, th = 0.1, seed = 7, step = 2.5, jit = 0.18, wav = 0.6 } = o;
  const r = mulberry(seed), c = Math.cos(ang), s = Math.sin(ang);
  const R = poly.map(([x, y]) => [x * c + y * s, -x * s + y * c]);
  let y0 = Infinity, y1 = -Infinity; for (const p of R) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  for (let yy = y0 + sp * r(); yy < y1; yy += sp * (1 + jit * (r() - 0.5))) {
    const xs = [];
    for (let i = 0; i < R.length; i++) {
      const a = R[i], b = R[(i + 1) % R.length];
      if ((a[1] <= yy) !== (b[1] <= yy)) xs.push(a[0] + (yy - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
    }
    xs.sort((a, b) => a - b);
    const ph = r() * 9;
    for (let k = 0; k + 1 < xs.length; k += 2) {
      const xa = xs[k], xb = xs[k + 1], n = Math.max(2, Math.ceil((xb - xa) / step));
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const xr = lerp(xa, xb, i / n), yr = yy + wav * Math.sin(xr * 0.02 + ph);
        pts.push([xr * c - yr * s, xr * s + yr * c]);
      }
      cut(pts, p => fam(tone(p[0], p[1]), th, w));
    }
  }
}
// the three families of tone
function engrave(poly, o) {
  const { ang = 0.6, sp = 4.2, tone, w = 1.7, seed = 1, cross = 1.05, third = -0.45 } = o;
  hatch(poly, { ...o, ang, sp, tone, w, th: o.th1 ?? 0.1, seed });
  hatch(poly, { ...o, ang: ang + cross, sp: sp * 1.12, tone, w: w * 0.8, th: 0.48, seed: seed + 11 });
  hatch(poly, { ...o, ang: ang + third, sp: sp * 1.3, tone, w: w * 0.6, th: 0.76, seed: seed + 23 });
}
function occlude(poly, grow = 0, clearWash = true) {
  if (clearWash) { wash.save(); wash.globalCompositeOperation = 'destination-out'; wash.beginPath(); poly.forEach((p, i) => i ? wash.lineTo(p[0], p[1]) : wash.moveTo(p[0], p[1])); wash.closePath(); wash.fill(); if (grow) { wash.lineWidth = grow; wash.stroke(); } wash.restore(); }
  ink.save(); ink.globalCompositeOperation = 'destination-out';
  ink.beginPath(); poly.forEach((p, i) => i ? ink.lineTo(p[0], p[1]) : ink.moveTo(p[0], p[1])); ink.closePath(); ink.fill();
  if (grow) { ink.lineWidth = grow; ink.lineJoin = 'round'; ink.stroke(); }
  ink.restore();
}
// contour cut in several runs, pinched where runs hand over
function outline(pts, { w = 1.6, closed = false, runLen = 140, seed = 3, min = 0.45 } = {}) {
  const r = mulberry(seed);
  let path = pts.slice(); if (closed) path.push(pts[0]);
  // resample
  const rs = [path[0]];
  for (let i = 1; i < path.length; i++) {
    const a = path[i - 1], b = path[i], l = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.ceil(l / 3));
    for (let k = 1; k <= n; k++) rs.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n)]);
  }
  let i = 0;
  while (i < rs.length - 1) {
    const n = Math.max(6, Math.round(runLen / 3 * (0.7 + 0.6 * r())));
    const j = Math.min(rs.length - 1, i + n);
    const run = rs.slice(i, j + 1), m = run.length;
    band(ink, run, run.map((_, k) => { const u = k / (m - 1); return w * (min + (1.35 - min) * Math.pow(Math.sin(PI * u), 0.7)); }));
    i = j - 1; if (j === rs.length - 1) break;
  }
}
function stipple(cx, cy, rad, n, size, seed) {
  const r = mulberry(seed);
  for (let i = 0; i < n; i++) {
    const a = r() * 2 * PI, d = Math.sqrt(r()) * rad;
    ink.beginPath(); ink.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d * 0.8, size * (0.5 + r()), 0, 2 * PI); ink.fill();
  }
}

/* ---------------- hand wash ---------------- */
function washRegion(poly, color, { seed = 1, alpha = 0.55, spill = 3 } = {}) {
  if (!WASH) return;
  const r = mulberry(seed);
  const jit = poly.map(([x, y], i) => [x + (vnoise(i * 0.37 + seed) - 0.5) * spill * 2 + (r() - .5) * 1.2, y + (vnoise(i * 0.41 + seed * 3) - 0.5) * spill * 2 + 1.5]);
  wash.save();
  wash.globalAlpha = alpha; wash.fillStyle = color;
  wash.beginPath(); jit.forEach((p, i) => i ? wash.lineTo(p[0], p[1]) : wash.moveTo(p[0], p[1])); wash.closePath(); wash.fill();
  // tide line at the wet edge
  wash.globalAlpha = alpha * 0.55; wash.strokeStyle = color; wash.lineWidth = 1.6; wash.stroke();
  // density lift
  wash.clip();
  wash.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 26; i++) {
    const [x0, y0] = jit[Math.floor(r() * jit.length)];
    const g = wash.createRadialGradient(x0, y0, 0, x0, y0, 40 + r() * 90);
    g.addColorStop(0, 'rgba(0,0,0,0.25)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    wash.globalAlpha = 1; wash.fillStyle = g; wash.fillRect(x0 - 140, y0 - 140, 280, 280);
  }
  wash.restore();
}

/* ---------------- paper ---------------- */
function makePaper() {
  const c = paper, r = mulberry(99);
  c.fillStyle = PAPER; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {
    const x = r() * W, y = r() * H, rad = 80 + r() * 320;
    const g = c.createRadialGradient(x, y, 0, x, y, rad);
    const dark = r() < 0.6;
    g.addColorStop(0, dark ? 'rgba(150,115,60,0.05)' : 'rgba(255,250,235,0.07)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  c.strokeStyle = 'rgba(120,95,55,0.035)'; c.lineWidth = 0.6;
  for (let y = 0; y < H; y += 4.5) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y + (r() - .5)); c.stroke(); }
  c.strokeStyle = 'rgba(120,95,55,0.045)'; c.lineWidth = 1;
  for (let x = 30; x < W; x += 64) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 2, H); c.stroke(); }
  for (let i = 0; i < 2600; i++) {
    const x = r() * W, y = r() * H, a = r() * PI, l = 3 + r() * 12;
    c.strokeStyle = `rgba(${r() < .5 ? '110,85,50' : '255,252,240'},${0.05 + r() * 0.07})`; c.lineWidth = 0.4 + r() * 0.5;
    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + Math.cos(a) * l * .5 + r() * 2, y + Math.sin(a) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
  }
  for (let i = 0; i < 90; i++) {
    const x = r() * W, y = r() * H, rad = 0.6 + r() * r() * 5;
    c.fillStyle = `rgba(140,95,45,${0.08 + r() * 0.18})`; c.beginPath(); c.arc(x, y, rad, 0, 2 * PI); c.fill();
  }
  // aged edges
  const g = c.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.62);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(120,85,40,0.16)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // plate mark: the pressed plate is a touch smoother and darker, with a bevel
  const m = 26;
  c.fillStyle = 'rgba(120,95,60,0.035)'; c.fillRect(m, m, W - 2 * m, H - 2 * m);
  c.strokeStyle = 'rgba(90,70,40,0.28)'; c.lineWidth = 1.4; c.strokeRect(m, m, W - 2 * m, H - 2 * m);
  c.strokeStyle = 'rgba(255,252,240,0.55)'; c.lineWidth = 1.2; c.strokeRect(m + 2, m + 2, W - 2 * m - 4, H - 2 * m - 4);
  c.strokeStyle = 'rgba(90,70,40,0.10)'; c.lineWidth = 3; c.strokeRect(m + 5, m + 5, W - 2 * m - 10, H - 2 * m - 10);
}

/* ---------------- frame, graticule, compass ---------------- */
const IN = { x0: 64, y0: 60, x1: W - 64, y1: H - 60 };
function frame() {
  ink.fillStyle = INK;
  const { x0, y0, x1, y1 } = IN;
  // heavy rule + hairline
  const rect = (a, b, c, d, w) => { band(ink, [[a, b], [c, b]], [w, w]); band(ink, [[c, b], [c, d]], [w, w]); band(ink, [[c, d], [a, d]], [w, w]); band(ink, [[a, d], [a, b]], [w, w]); };
  rect(x0 - 12, y0 - 12, x1 + 12, y1 + 12, 2.6);
  rect(x0 - 6, y0 - 6, x1 + 6, y1 + 6, 0.5);
  rect(x0, y0, x1, y1, 0.9);
  // graduated band between the two outer rules
  const seg = 40;
  for (let x = x0, k = 0; x < x1; x += seg, k++) if (k % 2 === 0) { ink.fillRect(x, y0 - 11, Math.min(seg, x1 - x), 4); ink.fillRect(x, y1 + 7, Math.min(seg, x1 - x), 4); }
  for (let y = y0, k = 0; y < y1; y += seg, k++) if (k % 2 === 0) { ink.fillRect(x0 - 11, y, 4, Math.min(seg, y1 - y)); ink.fillRect(x1 + 7, y, 4, Math.min(seg, y1 - y)); }
}
function graticule() {
  ink.fillStyle = INK;
  const { x0, y0, x1, y1 } = IN;
  for (let x = x0 + 240; x < x1; x += 240) band(ink, [[x, y0], [x, y1]], [0.45, 0.45]);
  for (let y = y0 + 240; y < y1; y += 240) band(ink, [[x0, y], [x1, y]], [0.45, 0.45]);
}
const ROSE = [1745, 196, 88];
function rhumbs() {
  const [cx, cy] = ROSE; ink.fillStyle = INK;
  for (let k = 0; k < 32; k++) {
    const a = k / 32 * 2 * PI;
    const pts = [[cx, cy]];
    // to the inner frame
    let t = 4000; const dx = Math.cos(a), dy = Math.sin(a);
    if (dx > 0) t = Math.min(t, (IN.x1 - cx) / dx); if (dx < 0) t = Math.min(t, (IN.x0 - cx) / dx);
    if (dy > 0) t = Math.min(t, (IN.y1 - cy) / dy); if (dy < 0) t = Math.min(t, (IN.y0 - cy) / dy);
    pts.push([cx + dx * t, cy + dy * t]);
    if (k % 4 === 0) band(ink, pts, [0.55, 0.55]);
    else if (k % 2 === 0) dashed(pts[0], pts[1], 0.45, 14, 6);
    else dashed(pts[0], pts[1], 0.35, 4, 7);
  }
}
function dashed(a, b, w, on, off) {
  const l = Math.hypot(b[0] - a[0], b[1] - a[1]);
  for (let s = 0; s < l; s += on + off) {
    const t0 = s / l, t1 = Math.min(1, (s + on) / l);
    band(ink, [[lerp(a[0], b[0], t0), lerp(a[1], b[1], t0)], [lerp(a[0], b[0], t1), lerp(a[1], b[1], t1)]], [w, w]);
  }
}
function compass() {
  const [cx, cy, R] = ROSE; ink.fillStyle = INK;
  const circ = (r) => { const p = []; for (let i = 0; i <= 180; i++) { const a = i / 180 * 2 * PI; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return p; };
  occlude(circ(R * 1.08), 0, true);
  outline(circ(R * 1.06), { w: 1.4, runLen: 200 });
  outline(circ(R * 0.98), { w: 0.7, runLen: 200 });
  for (let i = 0; i < 128; i++) {
    const a = i / 128 * 2 * PI, l = i % 4 === 0 ? 0.08 : 0.04;
    band(ink, [[cx + Math.cos(a) * R * 0.98, cy + Math.sin(a) * R * 0.98], [cx + Math.cos(a) * R * (0.98 - l), cy + Math.sin(a) * R * (0.98 - l)]], [0.6, 0.6]);
  }
  outline(circ(R * 0.86), { w: 0.6, runLen: 200 });
  const point = (a, len, wid, seed) => {
    const tip = [cx + Math.cos(a) * len, cy + Math.sin(a) * len];
    const l = [cx + Math.cos(a - PI / 2) * wid, cy + Math.sin(a - PI / 2) * wid];
    const rr = [cx + Math.cos(a + PI / 2) * wid, cy + Math.sin(a + PI / 2) * wid];
    occlude([[cx, cy], l, tip, rr]);
    // one half dark: hatched across
    hatch([[cx, cy], l, tip], { ang: a + PI / 2, sp: 2.4, tone: () => 0.9, w: 1.3, th: 0.05, seed, step: 1.5, wav: 0 });
    outline([[cx, cy], l, tip, rr], { w: 0.9, closed: true, runLen: 80, seed });
  };
  for (let k = 0; k < 8; k++) point(-PI / 2 + PI / 8 + k * PI / 4, R * 0.56, R * 0.08, 50 + k);
  for (let k = 0; k < 4; k++) point(-PI / 4 + k * PI / 2, R * 0.66, R * 0.11, 60 + k);
  for (let k = 0; k < 4; k++) point(-PI / 2 + k * PI / 2, R * 0.92, R * 0.14, 70 + k);
  outline(circ(R * 0.07), { w: 0.8, runLen: 60 });
  // north mark
  ink.font = '600 30px Bod'; ink.textAlign = 'center'; ink.fillText('N', cx, cy - R * 1.13);
}

/* ---------------- landscape ---------------- */
const HORIZON = P([0, 0, 400])[1];
function ridge(x, base, amp, f, seed) { return base - amp * (0.55 * vnoise(x * f + seed) + 0.3 * vnoise(x * f * 2.3 + seed * 2) + 0.15 * vnoise(x * f * 5.1 + seed * 3)); }
function hills() {
  const layers = [
    { base: HORIZON + 10, amp: 250, f: 0.004, seed: 4, tone: (x, y) => 0.18 + 0.1 * vnoise(x * 0.01 + y * 0.02), ang: 0.02, sp: 4.6, wash: '#cfae7c' },
    { base: HORIZON + 40, amp: 150, f: 0.006, seed: 9, tone: (x, y) => 0.3 + 0.18 * vnoise(x * 0.012), ang: 0.0, sp: 4.0, wash: '#c49a64' },
  ];
  for (const L of layers) {
    const poly = [];
    for (let x = IN.x0; x <= IN.x1; x += 6) poly.push([x, ridge(x, L.base, L.amp, L.f, L.seed)]);
    poly.push([IN.x1, HORIZON + 60], [IN.x0, HORIZON + 60]);
    occlude(poly);
    washRegion(poly, L.wash, { seed: L.seed, alpha: 0.45, spill: 6 });
    // shading falls on the slopes facing away from the light (left-lit: slopes rising to the right are dark)
    const tone = (x, y) => {
      const d = ridge(x + 6, L.base, L.amp, L.f, L.seed) - ridge(x - 6, L.base, L.amp, L.f, L.seed);
      return clamp(L.tone(x, y) + d * 0.035 + (y - ridge(x, L.base, L.amp, L.f, L.seed)) * -0.0008);
    };
    hatch(poly, { ang: L.ang, sp: L.sp, tone, w: 1.3, th: 0.1, seed: L.seed, wav: 1.2 });
    hatch(poly, { ang: 1.05, sp: L.sp * 1.3, tone, w: 1.0, th: 0.42, seed: L.seed + 5, wav: 0.4 });
    outline(poly.slice(0, poly.length - 2), { w: 1.0, runLen: 160, seed: L.seed });
  }
}
function tree(x, yb, h, wdt, seed, kind = 'round') {
  const r = mulberry(seed);
  const trunk = [[x - 3.5, yb], [x + 3.5, yb], [x + 2, yb - h * 0.45], [x - 2, yb - h * 0.45]];
  occlude(trunk); hatch(trunk, { ang: PI / 2, sp: 2.0, tone: xx => xx > x ? 0.85 : 0.5, w: 1.1, seed, wav: 0 });
  // foliage: overlapping lobes, back ones first; each lobe cut with its own tone field
  const lobes = [];
  const n = kind === 'cypress' ? 9 : 11;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const lx = kind === 'cypress' ? x + (r() - .5) * wdt * 0.5 : x + (r() - .5) * wdt * 0.8;
    const ly = kind === 'cypress' ? yb - h * (0.2 + 0.75 * t) : yb - h * (0.35 + 0.55 * r());
    const lr = kind === 'cypress' ? wdt * (0.32 - 0.16 * t) * (0.8 + 0.4 * r()) : wdt * (0.22 + 0.12 * r());
    lobes.push([lx, ly, lr]);
  }
  lobes.sort((a, b) => (a[0] - x) * 0.3 - (a[1] - yb) * -1 - ((b[0] - x) * 0.3 - (b[1] - yb) * -1));
  const all = [];
  for (const [lx, ly, lr] of lobes) {
    const poly = [];
    for (let i = 0; i < 30; i++) { const a = i / 30 * 2 * PI; const rr = lr * (1 + 0.1 * Math.sin(a * 6 + lx) + 0.05 * Math.sin(a * 13 + ly)); poly.push([lx + Math.cos(a) * rr, ly + Math.sin(a) * rr * 0.9]); }
    all.push(poly);
    occlude(poly);
    const tone = (px, py) => clamp(0.3 + (px - lx) / lr * 0.32 + (py - ly) / lr * 0.32 + (lx - x) / wdt * 0.3 + 0.12 * vnoise(px * 0.3 + py * 0.21));
    hatch(poly, { ang: 0.75, sp: 3.0, tone, w: 1.25, seed: seed + lx | 0, wav: 0.9, step: 2 });

/* ---------------- magnifying roundel ---------------- */
const RD = [1722, 812, 128];
function roundel(target) {
  const [cx, cy, R] = RD;
  const circ = r => { const p = []; for (let i = 0; i <= 160; i++) { const a = i / 160 * 2 * PI; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return p; };
  // leader from the part to the rim, with clearance
  const ang = Math.atan2(target[1] - cy, target[0] - cx);
  const rim = [cx + Math.cos(ang) * (R + 12), cy + Math.sin(ang) * (R + 12)];
  ink.fillStyle = INK;
  dashed(target, rim, 0.6, 8, 4);
  ink.beginPath(); ink.arc(target[0], target[1], 3, 0, 2 * PI); ink.fill();
  ink.font = 'italic 500 20px BodI'; ink.fillText('1', target[0] + 8, target[1] - 8);
  occlude(circ(R + 10), 0, true);
  // ruled machine ground
  for (let y = cy - R; y < cy + R; y += 2.6) {
    const hw = Math.sqrt(Math.max(0, R * R - (y - cy) ** 2));
    band(ink, [[cx - hw, y], [cx + hw, y]], [0.45, 0.45]);
  }
  // subject: the steel rod, the clamp, the strap, the hem with its bolt
  const sub1 = [];
  const rod = [[cx - R - 10, cy - 78], [cx + R + 10, cy - 98], [cx + R + 10, cy - 52], [cx - R - 10, cy - 32]];
  const strap = [[cx - 18, cy - 60], [cx + 18, cy - 62], [cx + 16, cy + 62], [cx - 16, cy + 62]];
  const hem = []; for (let i = 0; i <= 40; i++) { const x = cx - R - 10 + i / 40 * (2 * R + 20); hem.push([x, cy + 50 + 14 * Math.sin((x - cx) / R * 1.4)]); }
  for (let i = 40; i >= 0; i--) { const x = cx - R - 10 + i / 40 * (2 * R + 20); hem.push([x, cy + R + 20]); }
  ink.save(); ink.beginPath(); circ(R).forEach((p, i) => i ? ink.lineTo(p[0], p[1]) : ink.moveTo(p[0], p[1])); ink.clip();
  // white halo, then the parts
  for (const poly of [hem, strap, rod]) occlude(poly, 16);
  occlude(hem);
  hatch(hem, { ang: 0.08, sp: 3.0, tone: (x, y) => 0.15 + (y - cy - 50) / 120 * 0.4, w: 1.3, seed: 300, wav: 0.4 });
  const hemTop = hem.slice(0, 41); outline(hemTop, { w: 1.6, runLen: 120 });
  outline(hemTop.map(([x, y]) => [x, y + 12]), { w: 0.7, runLen: 120 });
  // stitches
  for (let x = cx - R; x < cx + R; x += 9) { const y = cy + 50 + 14 * Math.sin((x - cx) / R * 1.4) + 18; band(ink, [[x, y], [x + 5, y]], [0.9, 0.9]); }
  occlude(strap);
  hatch(strap, { ang: PI / 2, sp: 2.2, tone: (x, y) => 0.45 + (x - cx) / 36 * 0.6, w: 1.3, seed: 301, wav: 0 });
  outline(strap, { w: 1.4, closed: true, runLen: 80 });
  occlude(rod);
  const rodTone = (x, y) => { const yc = lerp(cy - 55, cy - 75, (x - cx + R) / (2 * R)); const s = (y - yc) / 23; return clamp(0.55 + 0.4 * s - 0.6 * Math.exp(-Math.pow((s + 0.45) / 0.15, 2))); };
  hatch(rod, { ang: -0.07, sp: 2.4, tone: rodTone, w: 1.5, seed: 302, wav: 0 });
  hatch(rod, { ang: 1.5, sp: 2.8, tone: rodTone, w: 1.1, th: 0.6, seed: 303, wav: 0 });
  outline([rod[0], rod[1]], { w: 1.2 }); outline([rod[3], rod[2]], { w: 1.8 });
  // clamp band wrapping the rod
  const band1 = [[cx - 24, cy - 92], [cx + 24, cy - 96], [cx + 24, cy - 40], [cx - 24, cy - 36]];
  occlude(band1, 6);
  hatch(band1, { ang: PI / 2 - 0.05, sp: 2.2, tone: (x, y) => 0.35 + (y - cy + 66) / 30 * 0.4, w: 1.3, seed: 304, wav: 0 });
  outline(band1, { w: 1.4, closed: true, runLen: 70 });
  // bolts
  for (const [bx, by] of [[cx, cy - 66], [cx, cy + 22], [cx, cy + 68]]) {
    const b = []; for (let i = 0; i < 6; i++) { const a = i / 6 * 2 * PI + 0.3; b.push([bx + Math.cos(a) * 9, by + Math.sin(a) * 9]); }
    occlude(b, 3); hatch(b, { ang: 0.8, sp: 1.8, tone: (x, y) => 0.3 + (x - bx + y - by) / 18 * 0.5, w: 1.1, seed: 305, step: 1 }); outline(b, { w: 1.0, closed: true, runLen: 40 });
  }
  ink.restore();
  // double-ruled ring
  outline(circ(R), { w: 2.0, runLen: 200 });
  outline(circ(R + 7), { w: 0.6, runLen: 200 });
}

/* ---------------- lettering ---------------- */
function cartouche() {
  const x0 = 100, y0 = 96, x1 = 640, y1 = 300;
  const box = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  occlude(box, 10, true);
  outline(box, { w: 2.2, closed: true, runLen: 220 });
  outline([[x0 + 8, y0 + 8], [x1 - 8, y0 + 8], [x1 - 8, y1 - 8], [x0 + 8, y1 - 8]], { w: 0.6, closed: true, runLen: 220 });
  // corner quarter-rounds
  for (const [cx, cy, a] of [[x0 + 8, y0 + 8, 0], [x1 - 8, y0 + 8, PI / 2], [x1 - 8, y1 - 8, PI], [x0 + 8, y1 - 8, 1.5 * PI]]) {
    const p = []; for (let i = 0; i <= 12; i++) { const t = a + i / 12 * PI / 2; p.push([cx + Math.cos(t) * 16, cy + Math.sin(t) * 16]); }
    outline(p, { w: 0.9, runLen: 60 });
  }
  ink.fillStyle = INK; ink.textAlign = 'center';
  const mx = (x0 + x1) / 2;
  ink.font = '600 15px Bod'; spaced('PLATE  I', mx, y0 + 40, 4);
  ink.font = '600 58px Nas'; ink.direction = 'rtl'; ink.fillText('کەپری ئۆتۆمبێل', mx, y0 + 112); ink.direction = 'ltr';
  ink.font = '600 22px Bod'; spaced('CANTILEVER  CAR  SHADE', mx, y0 + 158, 4);
  band(ink, [[mx - 120, y0 + 172], [mx + 120, y0 + 172]], [0.7, 0.7]);
  ink.font = '22px Pin'; ink.fillText('a tensile membrane on steel posts', mx, y0 + 196);
}
function spaced(txt, x, y, tr) {
  const ws = [...txt].map(ch => ink.measureText(ch).width + tr), tot = ws.reduce((a, b) => a + b, 0) - tr;
  let cx = x - tot / 2; ink.textAlign = 'left';
  [...txt].forEach((ch, i) => { ink.fillText(ch, cx, y); cx += ws[i]; });
  ink.textAlign = 'center';
}
function scaleBar() {
  // a real metric scale: metres at the front post plane
  const a = P([-3, 0, -0.6]), b = P([2, 0, -0.6]); const m = (b[0] - a[0]) / 5;
  const x0 = 110, y0 = 975;
  occlude([[x0 - 14, y0 - 46], [x0 + 5 * m + 70, y0 - 46], [x0 + 5 * m + 70, y0 + 26], [x0 - 14, y0 + 26]]);
  ink.fillStyle = INK;
  for (let i = 0; i < 5; i++) { if (i % 2 === 0) ink.fillRect(x0 + i * m, y0, m, 6); }
  band(ink, [[x0, y0], [x0 + 5 * m, y0]], [0.8, 0.8]); band(ink, [[x0, y0 + 6], [x0 + 5 * m, y0 + 6]], [0.8, 0.8]);
  for (let i = 0; i <= 5; i++) band(ink, [[x0 + i * m, y0 - 4], [x0 + i * m, y0 + 10]], [0.8, 0.8]);
  ink.font = '500 16px BodI'; ink.textAlign = 'center';
  for (let i = 0; i <= 5; i++) ink.fillText(String(i), x0 + i * m, y0 + 26);
  ink.font = '600 13px Bod'; spaced('SCALE  OF  METRES', x0 + 2.5 * m, y0 - 14, 3);
  ink.font = '600 22px Nas'; ink.direction = 'rtl'; ink.fillText('مەتر', x0 + 5 * m + 40, y0 + 10); ink.direction = 'ltr';
}
